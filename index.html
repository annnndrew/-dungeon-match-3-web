<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0a0a0d" />
  <title>Dungeon Match-3</title>
  <style>
:root {
  color-scheme: dark;
  --bg: #0a0a0d;
  --panel: #121217;
  --text: #e1e1e1;
  --muted: #b4b4b4;
  --gap: 3px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
body { min-height: 100dvh; overscroll-behavior: none; }
button { font: inherit; }

#app {
  width: min(100vw, 520px);
  min-height: 100dvh;
  margin: 0 auto;
  padding: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 8px;
}

.hud { width: 100%; }
.top-hud { display: flex; align-items: center; gap: 8px; min-height: 34px; }
#status { font-size: clamp(11px, 3vw, 13px); line-height: 1.2; color: #b7b7c5; }
.game-title { flex: 1; font-size: 12px; font-weight: 800; letter-spacing: .09em; color: #c6c6d0; }
.game-status { min-height: 16px; text-align: center; }
.game-status.danger { color: #ffae90 !important; }
.game-status.damage { color: #ff6666 !important; font-weight: 800; }
#new-game {
  border: 1px solid #555b66;
  background: #1b1d24;
  color: #ddd;
  border-radius: 8px;
  padding: 7px 9px;
}

#board-wrap { position: relative; width: 100%; }
#board {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  gap: var(--gap);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.tile {
  position: relative;
  aspect-ratio: 1 / 1;
  min-width: 0;
  border-radius: 3px;
  display: grid;
  place-items: center;
  overflow: hidden;
}
.tile.floor { background: rgb(82,78,72); }
.tile.wall { background: rgb(42,46,60); }
.tile .resource {
  font-size: clamp(17px, 6.2vw, 30px);
  font-weight: 700;
  line-height: 1;
  pointer-events: none;
}
.tile .resource.symbol-star { font-size: clamp(23px, 7.7vw, 38px); }
.tile .resource.falling {
  position: relative;
  z-index: 6;
  animation: waterfall-drop 420ms cubic-bezier(.20,.67,.27,1) both;
}
.tile.fall-tile { overflow: visible; z-index: 5; }
@keyframes waterfall-drop {
  from { transform: translateY(calc(-1 * var(--drop-px))); opacity: .70; }
  to { transform: translateY(0); opacity: 1; }
}
.tile.match-tile { box-shadow: inset 0 0 0 2px rgba(255,255,255,.70); filter: brightness(1.28); }
.tile.match-tile .resource { animation: match-pulse 340ms ease-out both; }
@keyframes match-pulse { 0% {transform:scale(1)} 50% {transform:scale(1.22)} 100% {transform:scale(1.05)} }
#match-fx { position:absolute; inset:0; z-index:12; pointer-events:none; overflow:visible; }
.reward-pop {
  position:absolute; font-size:clamp(19px,5.8vw,29px); font-weight:900;
  white-space:nowrap; text-shadow: 0 2px 4px #08080a, 0 0 7px #08080a;
  animation: reward-float 390ms ease-out both;
}
@keyframes reward-float {
  from { opacity:0; transform:translate(-50%,-60%) scale(.85); }
  28% { opacity:1; }
  to { opacity:1; transform:translate(-50%,-120%) scale(1); }
}
/* The hero responds to the swipe before the waterfall starts. */
.tile.hero-moving { overflow:visible; z-index:10; }
.tile.hero-moving .hero-mark {
  animation: hero-step 170ms ease-out both;
}
@keyframes hero-step {
  from { transform: translate(var(--hero-from-x),var(--hero-from-y)); }
  to { transform: translate(0,0); }
}
/* A monster's number and its red tile slide together to their next square. */
.tile.monster-moving { overflow:visible; z-index:9; }
.tile.monster-moving .monster-mark {
  animation: monster-step 260ms cubic-bezier(.2,.7,.3,1) both;
}
@keyframes monster-step {
  from { transform: translate(var(--monster-from-x),var(--monster-from-y)); }
  to { transform: translate(0,0); }
}
.tile .marker {
  position: absolute;
  top: 2px;
  font-size: clamp(9px, 2.7vw, 12px);
  line-height: 1;
  font-weight: 700;
  pointer-events: none;
}
.tile .marker.entrance { left: 4px; color: rgb(145,185,195); }
.tile.entrance-tile { background: #263943; border: 1px solid #6c97a5; }
.tile.entrance-tile .marker.entrance { left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: clamp(16px, 5vw, 26px); }
.tile.entrance-tile.hero .marker.entrance { opacity: .45; }
.tile.exit-tile { background: #403b29; border: 1px solid #b39a55; }
.tile.exit-tile .marker.exit { right: 50%; top: 50%; transform: translate(50%, -50%); font-size: clamp(16px, 5vw, 26px); }
.tile.exit-tile.hero .marker.exit { opacity: .45; }
/* A subtle heat map replaces threat outlines. Each adjacent monster adds
   another 20%-opacity red layer: 1 = 20%, 2 = 36%, 3 = 48.8%, etc.
   Tint is painted behind resources, markers, and sprites for readability. */
.tile.heat.floor {
  background: linear-gradient(rgba(218, 58, 68, var(--heat-alpha)), rgba(218, 58, 68, var(--heat-alpha))), rgb(82,78,72);
}
.tile.heat.entrance-tile {
  background: linear-gradient(rgba(218, 58, 68, var(--heat-alpha)), rgba(218, 58, 68, var(--heat-alpha))), #263943;
}
.tile.heat.exit-tile {
  background: linear-gradient(rgba(218, 58, 68, var(--heat-alpha)), rgba(218, 58, 68, var(--heat-alpha))), #403b29;
}
.tile.recent-hit .hero-mark { animation: hero-hit .34s ease-out; }
@keyframes hero-hit { 0%, 55% { color: #ff5151; transform:scale(1.3); } 100% { color:#fff; transform:scale(1); } }
.tile .marker.exit { right: 4px; color: rgb(225,205,120); }
.tile.hero .resource { visibility: hidden; }
.tile .hero-mark {
  position:absolute; inset:0;
  display:grid; place-items:center;
  font-size:clamp(24px,8vw,39px);
  font-weight:900; line-height:1;
  color:#fff;
  text-shadow:0 1px 2px #111, 0 0 5px #111;
  z-index:4;
  pointer-events:none;
}

.stats-hud {
  min-height: 58px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  align-items: stretch;
  font-size: clamp(12px, 3.5vw, 15px);
}
#hp { display: flex; flex-wrap: wrap; gap: 5px 12px; align-items: baseline; }
#hp .hp-value { color: #f06a6a; font-weight: 800; }
#hp .food-value { color: rgb(220,130,60); font-weight: 800; }
#hp .score-value { color: #f5d36e; font-weight: 800; }
#hp .key-value, #resources .key-value { color: #e4d0a0; font-weight: 700; }
#hp .turn-value { color: #b7b7c5; font-weight: 700; white-space: nowrap; }
/* Cascade power is transient: show it as a floating reward, not a HUD stat. */
.hero-bonus-pop { color: #a5f5d3; z-index: 16; }
.tile.attack-windup .hero-mark { animation: attack-lunge 220ms ease-out both; }
.tile.attack-target .monster-mark { animation: attack-hit 220ms ease-out both; }
@keyframes attack-lunge {
  0% { transform:translate(0,0) scale(1); }
  50% { transform:translate(var(--attack-x),var(--attack-y)) scale(1.15); }
  100% { transform:translate(0,0) scale(1); }
}
@keyframes attack-hit {
  0% { filter:brightness(1); }
  45% { filter:brightness(2); }
  100% { filter:brightness(1); }
}
#hp > span { white-space: nowrap; }
#hp .name { color: #b7b7c5; font-size: .85em; font-weight: 500; }
#resources .key-value { white-space: nowrap; }
.bottom-hud { min-height: 10px; }
#resources { display: flex; flex-wrap: wrap; gap: 3px 13px; align-items: baseline; }
.resource-count { white-space: nowrap; }
.resource-count .name { color: #a7a7b3; font-size: .85em; }
.resource-count .num { color: #b4b4b4; }
#version { font-size: 10px; color: #9999a8; text-align: right; }
.tile .monster-mark, .tile .key-mark, .tile .lumen-mark { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 900; font-size: clamp(20px, 7vw, 33px); z-index: 3; pointer-events: none; }
.tile .lumen-mark { color: #b5f9f7; font-size: clamp(25px, 8vw, 40px); text-shadow: 0 0 8px #7af5f1, 0 0 3px #fff; background:rgba(15,90,97,.45); border:1px solid rgba(120,230,229,.5); border-radius:3px; }
.tile .monster-mark { color: #fff0e6; background: #505369; border: 2px solid #8a8da6; border-radius: 3px; }
.tile .monster-pattern { position:absolute; right:1px; bottom:0; font-size:11px; line-height:12px; color:#fff5df; pointer-events:none; }
.tile.aggro .monster-mark { background: #a54c29; color: #fff5df; border-color: #ffd07b; box-shadow: inset 0 0 0 1px #ffd07b; }
.tile .key-mark { color: #17150b; background: #f5d36e; border: 2px solid #f9e8a7; border-radius: 3px; }
.tile.monster-tile .resource, .tile.key-tile .resource, .tile.lumen-tile .resource { visibility: hidden; }

#flash {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  z-index: 20;
}
#flash.invalid { background: rgba(105,65,80,.45); animation: flash 130ms ease-out; }
#flash.blocked { background: rgba(70,95,115,.60); animation: flash 160ms ease-out; }
#flash.starving { background: rgba(200,30,30,.62); animation: flash 180ms ease-out; }
@keyframes flash { from { opacity: 1; } to { opacity: 0; } }

.results {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: rgba(0,0,0,.72);
  display: grid;
  place-items: center;
  padding: 16px;
  overflow-y: auto;
}
.results.hidden { display: none; }
.results-panel {
  width: min(86%, 330px);
  background: rgba(18,18,23,.97);
  border: 1px solid #363640;
  border-radius: 12px;
  padding: 18px;
  text-align: center;
  box-shadow: 0 16px 40px rgba(0,0,0,.4);
  max-height: calc(100dvh - 32px);
  overflow-y: auto;
}
.results-panel h2 { margin: 0 0 8px; font-size: 26px; }
.results-panel .score { font-size: 21px; margin-bottom: 14px; }
.escape-bonus { color: #f5d36e; font-size: 12px; margin-top: 5px; }
.results-list { display: grid; gap: 5px; text-align: left; margin: 0 auto 16px; width: fit-content; }
.results-panel button { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #656575; background: #272731; color: #eee; }

@media (orientation: landscape) and (max-height: 540px) {
  #app { width: min(74vh, 520px); gap: 4px; padding-top: 4px; padding-bottom: 4px; }
  .top-hud { min-height: 28px; }
  .stats-hud { min-height: 38px; font-size: 11px; }
  #version { display: none; }
}

  </style>
</head>
<body>
  <main id="app">
    <header class="hud top-hud">
      <div class="game-title">DUNGEON MATCH</div>
      <button id="new-game" type="button">New game</button>
    </header>
    <div class="hud stats-hud">
      <div id="hp">HP 9</div>
      <div id="resources"></div>
    </div>
    <div id="status" class="hud game-status">Find the key, then escape.</div>

    <section id="board-wrap" aria-label="Dungeon Match-3 board">
      <div id="board"></div>
      <div id="match-fx" aria-hidden="true"></div>
      <div id="flash" aria-hidden="true"></div>
      <div id="results" class="results hidden" role="dialog" aria-modal="true"></div>
    </section>

    <footer class="hud bottom-hud"><div id="version">web reset 3.3 • swap / move 8 ways • match rows / columns</div></footer>
  </main>

  <script>
const CONFIG = {
  BOARD_COLS: 9,
  BOARD_ROWS: 11,
  ROOM_OPENING_MIN: 1,
  ROOM_OPENING_MAX: 3,
  ITEM_TYPES: ["food", "health", "monster", "gold", "bombs"],
  ITEM_LABEL: { food: "ϟ", health: "♥", monster: "✥", gold: "◉", bombs: "✦" },
  ITEM_COLOR: {
    food: "rgb(220,130,60)",
    health: "rgb(230,90,90)",
    monster: "rgb(91,216,174)",
    gold: "rgb(235,190,70)",
    bombs: "rgb(185,118,247)",
  },
  DUNGEON_FLOOR: "floor",
  DUNGEON_WALL: "wall",
  DUNGEON_FLOOR_COLOR: "rgb(82,78,72)",
  DUNGEON_WALL_COLOR: "rgb(42,46,60)",
  PLAYER_COLOR: "rgb(255,255,255)",
  ENTRANCE_COLOR: "rgb(145,185,195)",
  EXIT_COLOR: "rgb(225,205,120)",
  ENTRANCE_LABEL: "<",
  EXIT_LABEL: ">",
  STARTING_HP: 9,
  MAX_HP: 9,
  STARTING_FOOD: 60,
  STAGE_COUNT: 3,
  SUMMON_MATCHES_PER_SPAWN: 2,
  STORAGE_CAP: 9,
  MONSTER_START_COUNT: 3,
  MONSTER_MIN_HP: 1,
  MONSTER_MAX_HP: 3,
  BASE_ATTACK_DAMAGE: 2,
  MONSTER_SIGHT_RADIUS: 3,
  MONSTER_MEMORY_TURNS: 3,
  MONSTER_KILL_SCORE: 30,
  LUMEN_SCORE: 60,
  LUMEN_SCORE_CAP: 3,
  BOMB_RESET_THRESHOLD: 9, // Reset resource: automatic board refresh at nine.
  MIN_SWIPE: 18,
  MAX_CASCADE_WAVES: 250,
  MATCH_REWARDS: {
    food: { 3: 1, 4: 3, 5: 6 },
    health: { 3: 1, 4: 2, 5: 4 },
    monster: { 3: 1, 4: 2, 5: 5 },
    gold: { 3: 1, 4: 2, 5: 4 },
    bombs: { 3: 1, 4: 2, 5: 4 },
  },
};

const DIRECTIONS = {
  UP: [-1, 0],
  UP_RIGHT: [-1, 1],
  RIGHT: [0, 1],
  DOWN_RIGHT: [1, 1],
  DOWN: [1, 0],
  DOWN_LEFT: [1, -1],
  LEFT: [0, -1],
  UP_LEFT: [-1, -1],
};

const defaultRng = () => Math.random();

function seededRng(seed) {
  // Mulberry32: tiny deterministic RNG for tests/replays.
  let a = seed >>> 0;
  return () => {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function choice(values, rng = defaultRng) {
  return values[Math.floor(rng() * values.length)];
}

function randintInclusive(min, max, rng = defaultRng) {
  return min + Math.floor(rng() * (max - min + 1));
}

function inBounds(row, col) {
  return row >= 0 && row < CONFIG.BOARD_ROWS && col >= 0 && col < CONFIG.BOARD_COLS;
}

function generateDungeon({ rng = defaultRng, openingWidth = null } = {}) {
  // Four compact rooms in a 2×2 arrangement, with one or two-tile
  // doorways in each of the four separating wall segments.
  const rows = CONFIG.BOARD_ROWS;
  const cols = CONFIG.BOARD_COLS;
  const ground = Array.from({ length: rows }, () =>
    Array.from({ length: cols }, () => CONFIG.DUNGEON_WALL));
  const dividerRow = Math.floor(rows / 2); // 5
  const dividerCol = Math.floor(cols / 2); // 4
  const rooms = [
    { top: 1, bottom: dividerRow-1, left: 1, right: dividerCol-1 },
    { top: 1, bottom: dividerRow-1, left: dividerCol+1, right: cols-2 },
    { top: dividerRow+1, bottom: rows-2, left: 1, right: dividerCol-1 },
    { top: dividerRow+1, bottom: rows-2, left: dividerCol+1, right: cols-2 },
  ];
  for (const room of rooms) {
    for (let r=room.top;r<=room.bottom;r++)
      for (let c=room.left;c<=room.right;c++) ground[r][c] = CONFIG.DUNGEON_FLOOR;
  }
  const openingCells = [];
  function openSegment(fixed, min, max, horizontal) {
    const available = max-min+1;
    const width = openingWidth == null
      ? randintInclusive(1, Math.min(2,available), rng)
      : Math.max(1, Math.min(openingWidth,available));
    const start = randintInclusive(min,max-width+1,rng);
    for (let k=start;k<start+width;k++) {
      const pos = horizontal ? [fixed,k] : [k,fixed];
      ground[pos[0]][pos[1]] = CONFIG.DUNGEON_FLOOR;
      openingCells.push(pos);
    }
  }
  openSegment(dividerCol,1,dividerRow-1,false); // top pair
  openSegment(dividerCol,dividerRow+1,rows-2,false); // bottom pair
  openSegment(dividerRow,1,dividerCol-1,true); // left pair
  openSegment(dividerRow,dividerCol+1,cols-2,true); // right pair

  const entrancePos = [0,randintInclusive(rooms[0].left,rooms[0].right,rng)];
  const exitPos = [rows-1,randintInclusive(rooms[3].left,rooms[3].right,rng)];
  ground[entrancePos[0]][entrancePos[1]] = CONFIG.DUNGEON_FLOOR;
  ground[exitPos[0]][exitPos[1]] = CONFIG.DUNGEON_FLOOR;
  return { ground, rooms, entrancePos, exitPos, playerStart:[...entrancePos],
    dividerRow, dividerCol, openingCells };
}

function roomIndex(layout,row,col) {
  return layout.rooms.findIndex(room => row>=room.top && row<=room.bottom &&
    col>=room.left && col<=room.right);
}

function isWalkable(layout, row, col) {
  return inBounds(row, col) && layout.ground[row][col] === CONFIG.DUNGEON_FLOOR;
}

function isWall(layout, row, col) {
  return inBounds(row, col) && layout.ground[row][col] === CONFIG.DUNGEON_WALL;
}

function allWalkableConnected(layout) {
  const floors = [];
  for (let r = 0; r < CONFIG.BOARD_ROWS; r++) {
    for (let c = 0; c < CONFIG.BOARD_COLS; c++) {
      if (isWalkable(layout, r, c)) floors.push([r, c]);
    }
  }
  if (!floors.length) return false;

  const key = ([r, c]) => `${r},${c}`;
  const floorSet = new Set(floors.map(key));
  const seen = new Set([key(floors[0])]);
  const stack = [floors[0]];
  while (stack.length) {
    const [r, c] = stack.pop();
    for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const n = [r + dr, c + dc];
      const k = key(n);
      if (floorSet.has(k) && !seen.has(k)) {
        seen.add(k);
        stack.push(n);
      }
    }
  }
  return seen.size === floorSet.size;
}

function generateItemGrid({ layout = null, rows = CONFIG.BOARD_ROWS, cols = CONFIG.BOARD_COLS, rng = defaultRng } = {}) {
  const grid = [];
  for (let r = 0; r < rows; r++) {
    const row = [];
    for (let c = 0; c < cols; c++) {
      // Entrance and exit are permanent empty terrain cells; walls remain matchable.
      if (layout && ((r === layout.entrancePos[0] && c === layout.entrancePos[1]) ||
                     (r === layout.exitPos[0] && c === layout.exitPos[1]))) {
        row.push(null);
        continue;
      }
      const forbidden = new Set();
      if (c >= 2 && row[c - 1] === row[c - 2]) forbidden.add(row[c - 1]);
      if (r >= 2 && grid[r - 1][c] === grid[r - 2][c]) forbidden.add(grid[r - 1][c]);
      const choices = CONFIG.ITEM_TYPES.filter((item) => !forbidden.has(item));
      if (!choices.length) throw new Error("ITEM_TYPES cannot produce a stable starting board");
      row.push(choice(choices, rng));
    }
    grid.push(row);
  }
  return grid;
}

function coordKey([r, c]) { return `${r},${c}`; }

function maskedGrid(itemGrid, blockedCells = []) {
  const blocked = new Set(blockedCells.map(coordKey));
  return itemGrid.map((row, r) => row.map((item, c) => blocked.has(`${r},${c}`) ? null : item));
}

const MATCH_AXES = [
  { dr:0, dc:1, name:"horizontal" },
  { dr:1, dc:0, name:"vertical" },
];

function findMatchRuns(grid) {
  if (!grid.length || !grid[0].length) return [];
  const rows=grid.length,cols=grid[0].length,runs=[];
  const inside=(r,c)=>r>=0 && r<rows && c>=0 && c<cols;
  for (const {dr,dc} of MATCH_AXES) {
    for (let r=0;r<rows;r++) for (let c=0;c<cols;c++) {
      const kind=grid[r][c];
      if (kind==null) continue;
      // A run starts only where its predecessor differs (or is off-board).
      const pr=r-dr,pc=c-dc;
      if (inside(pr,pc) && grid[pr][pc]===kind) continue;
      const run=[];
      for (let nr=r,nc=c;inside(nr,nc) && grid[nr][nc]===kind;nr+=dr,nc+=dc)
        run.push([nr,nc]);
      if (run.length>=3) runs.push(run);
    }
  }
  return runs;
}

function runOrientation(run) {
  const dr=run[1][0]-run[0][0],dc=run[1][1]-run[0][1];
  return MATCH_AXES.find(axis=>axis.dr===dr && axis.dc===dc).name;
}

function matchSummary(state) {
  const summary={total:0,diagonal:0,clearedTiles:0,waves:state.stats.matchWaves.length,
    cascadeWaves:0,longestCascade:0,
    byOrientation:Object.fromEntries(MATCH_AXES.map(a=>[a.name,0])),
    byResource:Object.fromEntries(CONFIG.ITEM_TYPES.map(kind=>[kind,0])),
    byLength:{},byStage:{},bySource:{}};
  for (const wave of state.stats.matchWaves) {
    summary.clearedTiles+=wave.clearedTiles;
    if (wave.wave>1) summary.cascadeWaves++;
    summary.longestCascade=Math.max(summary.longestCascade,wave.wave);
    for (const run of wave.runs) {
      summary.total++;
      summary.byOrientation[run.orientation]++;
      summary.byResource[run.kind]++;
      summary.byLength[run.length]=(summary.byLength[run.length]||0)+1;
      summary.byStage[wave.stage]=(summary.byStage[wave.stage]||0)+1;
      summary.bySource[wave.source]=(summary.bySource[wave.source]||0)+1;
      if (run.orientation.startsWith("diagonal")) summary.diagonal++;
    }
  }
  return summary;
}

function runData(state) {
  return {version:"3.3",outcome:state.gameWon ? "rescued" : state.gameOverReason || "in-progress",
    stage:state.stage,health:state.hp,resources:{...state.resources},score:scoreBreakdown(state),
    matches:matchSummary(state),stats:state.stats};
}

function resourcesForRunLength(itemType, length) {
  if (!(itemType in CONFIG.MATCH_REWARDS)) throw new Error(`Unknown resource: ${itemType}`);
  if (length < 3) return 0;
  return CONFIG.MATCH_REWARDS[itemType][Math.min(length, 5)];
}

function swapCells(grid, a, b) {
  const [ar, ac] = a;
  const [br, bc] = b;
  [grid[ar][ac], grid[br][bc]] = [grid[br][bc], grid[ar][ac]];
}

function activatedRunsAfterSwap(grid, a, b, blockedCells = []) {
  swapCells(grid, a, b);
  try {
    const runs = findMatchRuns(maskedGrid(grid, blockedCells));
    const ak = coordKey(a), bk = coordKey(b);
    return runs.filter((run) => run.some((p) => {
      const k = coordKey(p);
      return k === ak || k === bk;
    }));
  } finally {
    swapCells(grid, a, b);
  }
}

function waterfallRefill(grid, matched, { fixedCells = [], dropDistances = null, rng = defaultRng } = {}) {
  // Collapse matched resources downward by column, preserving order.
  // Entrance/exit are permanent holes that split a column into segments.
  const fixed = new Set(fixedCells.map(coordKey));
  const changed = new Set();
  const rows = grid.length, cols = grid[0].length;
  for (const key of matched) {
    const [r,c] = key.split(",").map(Number);
    grid[r][c] = null;
    changed.add(key);
  }
  for (let c=0;c<cols;c++) {
    let bottom=rows-1;
    while (bottom>=0) {
      if (fixed.has(`${bottom},${c}`)) { grid[bottom][c]=null; bottom--; continue; }
      let top=bottom;
      while (top>0 && !fixed.has(`${top-1},${c}`)) top--;
      const values=[];
      for (let r=bottom;r>=top;r--) if (grid[r][c]!=null) values.push({value:grid[r][c],sourceRow:r});
      let index=0;
      let newIndex=0;
      for (let r=bottom;r>=top;r--) {
        const existing=index<values.length ? values[index++] : null;
        const value=existing ? existing.value : choice(CONFIG.ITEM_TYPES,rng);
        // Distance measured in whole board rows, so the UI can show actual gravity.
        const sourceRow=existing ? existing.sourceRow : top-(++newIndex);
        if (dropDistances && r>sourceRow) dropDistances[`${r},${c}`]=r-sourceRow;
        if (grid[r][c] !== value) changed.add(`${r},${c}`);
        grid[r][c]=value;
      }
      bottom=top-1;
    }
  }
  return changed;
}

function resolveCascades(grid, { blockedCells = [], fixedCells = [], rewardCallback = null,
  afterWave = null, onFall = null, onWave = null, rng = defaultRng } = {}) {
  let waves=0, totalRuns=0, totalReplacements=0;
  while (true) {
    const blocked=typeof blockedCells === "function" ? blockedCells() : blockedCells;
    const runs=findMatchRuns(maskedGrid(grid,blocked));
    if (!runs.length) break;
    if (++waves>CONFIG.MAX_CASCADE_WAVES) throw new Error("Cascade exceeded safety limit");
    if (onWave) onWave("before", runs, null);
    const matched=new Set();
    for (const run of runs) {
      const [r,c]=run[0];
      if (rewardCallback) rewardCallback(grid[r][c],run.length);
      for (const pos of run) matched.add(coordKey(pos));
    }
    const dropDistances = onWave ? {} : null;
    const changed=waterfallRefill(grid,matched,{fixedCells,dropDistances,rng});
    if (onFall) onFall(changed);
    if (afterWave) afterWave();
    if (onWave) onWave("after", runs, dropDistances);
    totalRuns+=runs.length;
    totalReplacements+=matched.size;
  }
  return { waves, runs:totalRuns, replacements:totalReplacements };
}

function startingResources() {
  return { food: CONFIG.STARTING_FOOD, monster: 0, gold: 0, bombs: 0 };
}

function grantRunReward(state, itemType, runLength) {
  const gained = resourcesForRunLength(itemType, runLength);
  state.stats.resourcesCollected[itemType] += gained;
  if (itemType === "health") {
    state.hp = Math.min(CONFIG.MAX_HP,state.hp + gained);
    state.stats.peakHealth=Math.max(state.stats.peakHealth,state.hp);
    return;
  }
  if (itemType === "monster") {
    // M is no longer a stored resource: every match immediately creates enemies.
    // Every two summon units create one enemy; remainder carries between stages.
    state.summonProgress += gained;
    state.pendingSpawns += Math.floor(state.summonProgress / CONFIG.SUMMON_MATCHES_PER_SPAWN);
    state.summonProgress %= CONFIG.SUMMON_MATCHES_PER_SPAWN;
    return;
  }
  // Moves replenish up to the starting reserve; other resources retain their caps.
  state.resources[itemType] = Math.max(state.resources[itemType],
    Math.min(itemType === "food" ? CONFIG.STARTING_FOOD : CONFIG.STORAGE_CAP, state.resources[itemType] + gained));
  if (itemType === "bombs" && state.resources.bombs >= CONFIG.BOMB_RESET_THRESHOLD) {
    state.resources.bombs = 0;
    state.pendingResets++;
  }
}

function occupiedCells(state) {
  const occupied = [[state.playerRow, state.playerCol], ...state.monsters.map((m) => [m.row, m.col])];
  if (!state.hasKey) occupied.push(state.keyPos);
  if (state.lumenPos) occupied.push(state.lumenPos);
  return occupied;
}

function monsterAt(state, row, col) {
  return state.monsters.find((m) => m.row === row && m.col === col);
}

function buildMatchBoard(state) {
  return maskedGrid(state.itemGrid, occupiedCells(state));
}

function keyIsAt(state, row, col) {
  return !state.hasKey && state.keyPos[0] === row && state.keyPos[1] === col;
}

function lumenIsAt(state,row,col) {
  return !!state.lumenPos && state.lumenPos[0] === row && state.lumenPos[1] === col;
}

function placeLumenstone(state,rng=defaultRng) {
  if (state.stageLumenCollected) { state.lumenPos = null; return false; }
  const spots=[];
  for (let r=0;r<CONFIG.BOARD_ROWS;r++) for (let c=0;c<CONFIG.BOARD_COLS;c++) {
    if (!isWalkable(state.dungeon,r,c) || (r===state.playerRow && c===state.playerCol) ||
        monsterAt(state,r,c) || keyIsAt(state,r,c) ||
        coordKey([r,c])===coordKey(state.dungeon.entrancePos) ||
        coordKey([r,c])===coordKey(state.dungeon.exitPos)) continue;
    spots.push([r,c]);
  }
  state.lumenPos = spots.length ? choice(spots,rng) : null;
  return !!state.lumenPos;
}

function spawnMonster(state, rng = defaultRng) {
  const candidates = [];
  for (let r = 0; r < CONFIG.BOARD_ROWS; r++) {
    for (let c = 0; c < CONFIG.BOARD_COLS; c++) {
      if (!isWalkable(state.dungeon, r, c)) continue;
      if (r === state.playerRow && c === state.playerCol) continue;
      if (monsterAt(state, r, c) || keyIsAt(state, r, c) || lumenIsAt(state,r,c)) continue;
      if (coordKey([r,c]) === coordKey(state.dungeon.exitPos)) continue;
      if (coordKey([r,c]) === coordKey(state.dungeon.entrancePos)) continue;
      candidates.push([r,c]);
    }
  }
  if (!candidates.length) return false;
  const [row,col] = choice(candidates, rng);
  const monster = { row, col,
    hp: randintInclusive(CONFIG.MONSTER_MIN_HP, CONFIG.MONSTER_MAX_HP, rng) + (state.stage - 1),
    type: choice(MONSTER_STAGE_POOLS[state.stage] || MONSTER_STAGE_POOLS[1],rng),
    aggro: false, lastSeen: null, memory: 0, seesPlayer: false };
  state.monsters.push(monster);
  if (monsterCanSeePlayer(state,monster)) alertMonster(state,monster);
  return true;
}

// Types describe capabilities; AI and rendering consume the same definitions.
// Add future monsters here, then give them a weight in MONSTER_STAGE_POOLS.
const MONSTER_TYPES = {
  basic: { name: "Guard", attack: "cardinal", symbol: "+", damage: 1 },
  advanced: { name: "Hunter", attack: "eight", symbol: "✳︎", damage: 1 },
};
const MONSTER_STAGE_POOLS = {
  1: ["basic"],
  2: ["basic", "basic", "advanced"],
  3: ["basic", "advanced", "advanced"],
};

function monsterType(monster) {
  return MONSTER_TYPES[monster.type] || MONSTER_TYPES.basic;
}

function clearDiagonal(layout, r, c, nr, nc) {
  return r === nr || c === nc ||
    (isWalkable(layout,r,nc) && isWalkable(layout,nr,c));
}

function hasLineOfSight(layout, fromRow, fromCol, toRow, toCol) {
  // Traverse every grid cell crossed by a center-to-center ray. At exact
  // corners both side cells must be floor: no peeking between touching walls.
  if (!isWalkable(layout,fromRow,fromCol) || !isWalkable(layout,toRow,toCol)) return false;
  const dx = toCol-fromCol, dy = toRow-fromRow;
  const nx = Math.abs(dx), ny = Math.abs(dy);
  const sx = Math.sign(dx), sy = Math.sign(dy);
  let x=fromCol, y=fromRow, ix=0, iy=0;
  while (ix<nx || iy<ny) {
    const decision = (1+2*ix)*ny - (1+2*iy)*nx;
    if (decision === 0) {
      if (!isWalkable(layout,y,x+sx) || !isWalkable(layout,y+sy,x)) return false;
      x+=sx; y+=sy; ix++; iy++;
    } else if (decision < 0) { x+=sx; ix++; }
    else { y+=sy; iy++; }
    if (!isWalkable(layout,y,x)) return false;
  }
  return true;
}

function monsterCanSeePlayer(state, monster) {
  return Math.max(Math.abs(monster.row-state.playerRow),
    Math.abs(monster.col-state.playerCol)) <= CONFIG.MONSTER_SIGHT_RADIUS &&
    hasLineOfSight(state.dungeon,monster.row,monster.col,state.playerRow,state.playerCol);
}

function monsterCanAttack(state, monster, row, col) {
  const dr=Math.abs(monster.row-row), dc=Math.abs(monster.col-col);
  if (Math.max(dr,dc)!==1 || !isWalkable(state.dungeon,row,col)) return false;
  if (dr && dc) {
    if (monsterType(monster).attack !== "eight") return false;
    // Only room interiors allow diagonal attacks. Doors, halls and stairs
    // always restrict monsters to cardinal attacks, even for advanced types.
    const room=roomIndex(state.dungeon,monster.row,monster.col);
    if (room<0 || roomIndex(state.dungeon,row,col)!==room) return false;
  }
  return hasLineOfSight(state.dungeon,monster.row,monster.col,row,col);
}

function alertMonster(state, monster) {
  monster.aggro=true;
  monster.seesPlayer=monsterCanSeePlayer(state,monster);
  monster.lastSeen=[state.playerRow,state.playerCol];
  monster.memory=CONFIG.MONSTER_MEMORY_TURNS;
}

function updateMonsterAwareness(state) {
  for (const monster of state.monsters) {
    monster.seesPlayer=monsterCanSeePlayer(state,monster);
    if (monster.seesPlayer) alertMonster(state,monster);
    else if (!(monster.memory>0)) {
      monster.aggro=false;
      monster.lastSeen=null;
    }
  }
}

function monsterCanStep(state, monster, r, c, fromRow=monster.row, fromCol=monster.col) {
  return isWalkable(state.dungeon,r,c) && clearDiagonal(state.dungeon,fromRow,fromCol,r,c) &&
    !(r===state.playerRow && c===state.playerCol) && !lumenIsAt(state,r,c) &&
    !state.monsters.some(m=>m!==monster && m.row===r && m.col===c);
}

function chaseStep(state, monster) {
  if (!monster.lastSeen) return null;
  // Visible hero: find a valid attack position for THIS monster's pattern.
  // Hidden hero: investigate only the last seen tile, never their live position.
  const reached = (r,c) => monster.seesPlayer
    ? monsterCanAttack(state,{...monster,row:r,col:c},state.playerRow,state.playerCol)
    : r===monster.lastSeen[0] && c===monster.lastSeen[1];
  const queue=[{row:monster.row,col:monster.col,first:null}];
  const visited=new Set([coordKey([monster.row,monster.col])]);
  for (let i=0;i<queue.length;i++) {
    const node=queue[i];
    if (reached(node.row,node.col)) return node.first;
    // Fixed order makes pursuit predictable, including equal-distance paths.
    for (const [dr,dc] of Object.values(DIRECTIONS)) {
      const r=node.row+dr,c=node.col+dc,key=coordKey([r,c]);
      if (visited.has(key) || !monsterCanStep(state,monster,r,c,node.row,node.col)) continue;
      visited.add(key);
      queue.push({row:r,col:c,first:node.first || [r,c]});
    }
  }
  return null;
}

function moveMonsters(state, rng = defaultRng, alreadyActed = new Set()) {
  for (const monster of state.monsters) {
    if (!alreadyActed.has(monster)) {
      if (monster.aggro) {
        const step=chaseStep(state,monster);
        if (step) [monster.row,monster.col]=step;
      } else {
        const options=Object.values(DIRECTIONS).map(([dr,dc])=>[monster.row+dr,monster.col+dc])
          .filter(([r,c])=>monsterCanStep(state,monster,r,c));
        if (options.length) [monster.row,monster.col]=choice(options,rng);
      }
    }
    // A hidden elf gets three investigation actions before pursuit ends.
    if (monster.aggro && !monster.seesPlayer) {
      monster.memory=Math.max(0,monster.memory-1);
      if (!monster.memory) { monster.aggro=false; monster.lastSeen=null; }
    }
    // Wandering into sight alerts immediately; moving never also attacks.
    if (monsterCanSeePlayer(state,monster)) alertMonster(state,monster);
  }
}

function resolveProximityDamage(state, damagedThisTurn = new Set()) {
  let damage=0;
  for (const monster of state.monsters) {
    if (damagedThisTurn.has(monster) ||
        !monsterCanAttack(state,monster,state.playerRow,state.playerCol)) continue;
    damagedThisTurn.add(monster);
    const hit=monsterType(monster).damage;
    state.hp=Math.max(0,state.hp-hit);
    damage+=hit;
  }
  state.lastProximityDamage=damage;
  if (!state.hp) { state.gameOver=true; state.gameOverReason="death"; }
  return damage;
}

function adjacentMonsterCount(state,row,col) {
  // Heatmap and actual damage share the same pattern and wall checks.
  return state.monsters.reduce((total,m)=>total+
    (monsterCanAttack(state,m,row,col) ? monsterType(m).damage : 0),0);
}

function isThreatened(state, row, col) {
  return adjacentMonsterCount(state, row, col) > 0;
}

function dangerOpacity(monsterCount) {
  // Alpha-compositing independent 20% red layers, not linear addition.
  return monsterCount > 0 ? 1 - Math.pow(0.8, monsterCount) : 0;
}

function scoreBreakdown(state) {
  // Objective progress and combat earn points; turns still carry a penalty.
  // The optional lumenstone bonus is capped, so lingering cannot inflate score.
  const rooms = (state.roomsExplored + Math.max(0,state.visitedRooms.size-1))*100;
  const key = (state.keysCollected + (state.hasKey && state.stage < CONFIG.STAGE_COUNT ? 1 : 0))*250;
  const lumen = Math.min(state.stats.lumenCollected,CONFIG.LUMEN_SCORE_CAP)*CONFIG.LUMEN_SCORE;
  const escape = state.stagesCompleted*400 + (state.gameWon ? 1200 : 0);
  const kills = state.stats.monstersKilled*CONFIG.MONSTER_KILL_SCORE;
  const survival = state.gameWon ? state.hp*10 : 0;
  const turns = state.stats.turns*6;
  return { rooms, key, lumen, escape, kills, survival, turns,
    total: Math.max(0,rooms+key+lumen+escape+kills+survival-turns) };
}

function updateScore(state) {
  const index=roomIndex(state.dungeon,state.playerRow,state.playerCol);
  if (index>=0) state.visitedRooms.add(index);
  state.score=scoreBreakdown(state).total;
}

function processTriggers(state, rng = defaultRng, { allowReset = true } = {}) {
  while (state.pendingSpawns > 0) {
    state.pendingSpawns--;
    if (spawnMonster(state,rng)) {
      state.stats.monstersSpawned++;
      state.lastEvent = "MONSTER SPAWNED!";
    }
  }
  if (allowReset && state.pendingResets > 0) {
    state.pendingResets = 0;
    // Fresh resources on every cell, walls included; occupants remain in place.
    // Avoid free matches and prefer a board with at least one legal move.
    let fallback = null;
    for (let attempt = 0; attempt < 250; attempt++) {
      const grid = generateItemGrid({ layout: state.dungeon, rng });
      fallback = grid;
      state.itemGrid = grid;
      if (hasLegalMatchMove(state)) break;
    }
    state.itemGrid = fallback;
    state.stats.boardResets++;
  }
}

function canPlayerMove(state, direction) {
  const delta = DIRECTIONS[direction];
  if (!delta) return false;
  const r = state.playerRow + delta[0], c = state.playerCol + delta[1];
  // Moving toward an occupied floor tile is an attack, not a blocked move.
  return isWalkable(state.dungeon, r, c) &&
    clearDiagonal(state.dungeon,state.playerRow,state.playerCol,r,c);
}

function swapTarget(fromRow, fromCol, direction) {
  const delta = DIRECTIONS[direction];
  return delta ? [fromRow + delta[0], fromCol + delta[1]] : null;
}

function swapIsBoardLegal(state, fromRow, fromCol, direction) {
  const target = swapTarget(fromRow, fromCol, direction);
  if (!target) return false;
  const [tr, tc] = target;
  if (!inBounds(fromRow, fromCol) || !inBounds(tr, tc)) return false;
  // Swaps may involve walls, but entrance and exit have no resources.
  for (const special of [state.dungeon.entrancePos, state.dungeon.exitPos]) {
    if (coordKey([fromRow,fromCol]) === coordKey(special) ||
        coordKey([tr,tc]) === coordKey(special)) return false;
  }
  if (monsterAt(state, fromRow, fromCol) || monsterAt(state, tr, tc)) return false;
  if (keyIsAt(state, fromRow, fromCol) || keyIsAt(state, tr, tc) ||
      lumenIsAt(state,fromRow,fromCol) || lumenIsAt(state,tr,tc)) return false;
  if ((fromRow === state.playerRow && fromCol === state.playerCol) ||
      (tr === state.playerRow && tc === state.playerCol)) return false;
  return true;
}

function snapshotBoard(state) {
  return {
    stage: state.stage,
    dungeon: state.dungeon,
    itemGrid: state.itemGrid.map(row => [...row]),
    playerRow: state.playerRow, playerCol: state.playerCol,
    monsters: state.monsters.map(m => ({...m})),
    keyPos: [...state.keyPos], hasKey: state.hasKey,
    lumenPos: state.lumenPos ? [...state.lumenPos] : null,
    lastProximityDamage: 0, lastAttackDamage: 0,
    lastFallCells: new Set(),
  };
}

function resolveAllMatches(state, rng = defaultRng, {source="natural"} = {}) {
  let pendingFrame = null;
  let waveNumber=0;
  const outcome = resolveCascades(state.itemGrid, {
    blockedCells: () => occupiedCells(state),
    fixedCells: [state.dungeon.entrancePos,state.dungeon.exitPos],
    onFall: (changed) => { for (const pos of changed) state.lastFallCells.add(pos); },
    rewardCallback: (kind, length) => grantRunReward(state, kind, length),
    // Spawn after each wave so new monsters can block matches in the next wave.
    // B resets wait until the cascade is complete, avoiding stale grid references.
    afterWave: () => processTriggers(state, rng, { allowReset: false }),
    onWave: (phase, runs, dropDistances) => {
      if (phase === "before") {
        state.stats.matchWaves.push({
          turn:state.stats.turns+(source === "swap" ? 1 : 0),stage:state.stage,
          source,wave:++waveNumber,
          clearedTiles:new Set(runs.flatMap(run=>run.map(coordKey))).size,
          runs:runs.map(run=>({kind:state.itemGrid[run[0][0]][run[0][1]],
            length:run.length,orientation:runOrientation(run),
            reward:resourcesForRunLength(state.itemGrid[run[0][0]][run[0][1]],run.length),
            cells:run.map(pos=>[...pos])})),
        });
        pendingFrame = {
          before: snapshotBoard(state),
          matches: runs.map(run => ({
            cells: run.map(pos => [...pos]),
            kind: state.itemGrid[run[0][0]][run[0][1]],
            gained: resourcesForRunLength(state.itemGrid[run[0][0]][run[0][1]],run.length),
          })),
        };
      } else if (pendingFrame) {
        pendingFrame.after = snapshotBoard(state);
        pendingFrame.dropDistances = dropDistances;
        state.animationEvents.push(pendingFrame);
        pendingFrame = null;
      }
    },
    rng,
  });
  processTriggers(state, rng);
  // Only additional waterfall waves count toward cascade damage.
  // This function grants resources for every wave, but never stores damage:
  // only the initiating swap's waves can empower an attack on that turn.
  return outcome;
}

function consumeFoodAfterMove(state) {
  state.resources.food = Math.max(0, state.resources.food - 1);
  if (state.resources.food === 0) {
    state.lastMoveStarved = true;
    state.gameOver = true;
    state.gameOverReason = "starvation";
  }
}

function movePlayerOneStep(state, direction) {
  const [dr, dc] = DIRECTIONS[direction];
  state.playerRow += dr;
  state.playerCol += dc;
  state.stats.turns += 1;
}

function swapWouldMatch(state, row, col, direction) {
  if (!swapIsBoardLegal(state, row, col, direction)) return false;
  const target = swapTarget(row, col, direction);
  return activatedRunsAfterSwap(
    state.itemGrid,
    [row, col],
    target,
    occupiedCells(state),
  ).length > 0;
}

function hasLegalMatchMove(state) {
  if (state.gameWon || state.gameOver) return false;
  for (const direction of Object.keys(DIRECTIONS)) {
    if (!canPlayerMove(state, direction)) continue;
    for (let r = 0; r < CONFIG.BOARD_ROWS; r++) {
      for (let c = 0; c < CONFIG.BOARD_COLS; c++) {
        if (swapWouldMatch(state, r, c, direction)) return true;
      }
    }
  }
  return false;
}

function endIfNoMoves(state) {
  if (!hasLegalMatchMove(state)) {
    state.gameOver = true;
    state.gameOverReason = "no_moves";
  }
}

function newGame({ rng = defaultRng, dungeonLayout = null, itemGrid = null, stage = 1 } = {}) {
  const layout = dungeonLayout ?? generateDungeon({ rng });
  const state = {
    stage,
    stagesCompleted: 0,
    roomsExplored: 0,
    keysCollected: 0,
    stageLumenCollected: false,
    summonProgress: 0,
    dungeon: layout,
    itemGrid: itemGrid ? itemGrid.map((row, r) => row.map((item, c) =>
      (r === layout.entrancePos[0] && c === layout.entrancePos[1]) ||
      (r === layout.exitPos[0] && c === layout.exitPos[1]) ? null : item)) : null,
    playerRow: layout.playerStart[0],
    playerCol: layout.playerStart[1],
    resources: startingResources(),
    hp: CONFIG.STARTING_HP,
    score: 0,
    maxDepth: layout.playerStart[0],
    visitedRooms: new Set([0]),
    lumenPos: null,
    lastFallCells: new Set(),
    animationEvents: [],
    lastProximityDamage: 0,
    lastAttackDamage: 0,
    lastAttackDealt: 0,
    lastAttackBonusUsed: 0,
    lastCascadeBonus: 0,
    monsters: [],
    keyPos: null,
    hasKey: false,
    pendingSpawns: 0,
    pendingResets: 0,
    gameOver: false,
    gameWon: false,
    gameOverReason: "",
    lastMoveStarved: false,
    lastMoveBlocked: false,
    lastEvent: "",
    stats: {
      turns: 0,
      matchWaves: [],
      turnLog: [],
      peakHealth: CONFIG.STARTING_HP,
      boardResets: 0,
      monstersSpawned: 0,
      monstersKilled: 0,
      damageDealt: 0,
      cascadeDamageDealt: 0,
      cascadePoweredAttacks: 0,
      lumenCollected: 0,
      resourcesCollected: Object.fromEntries(CONFIG.ITEM_TYPES.map((item) => [item, 0])),
    },
  };

  const keyCandidates = [];
  for (let r = 0; r < CONFIG.BOARD_ROWS; r++) {
    for (let c = 0; c < CONFIG.BOARD_COLS; c++) {
      if (!isWalkable(layout,r,c)) continue;
      if (r === state.playerRow && c === state.playerCol) continue;
      if (coordKey([r,c]) === coordKey(layout.exitPos)) continue;
      if (coordKey([r,c]) === coordKey(layout.entrancePos)) continue;
      if (stage === CONFIG.STAGE_COUNT && roomIndex(layout,r,c) !== 3) continue;
      keyCandidates.push([r,c]);
    }
  }
  state.keyPos = choice(keyCandidates,rng);
  for (let i = 0; i < CONFIG.MONSTER_START_COUNT; i++) spawnMonster(state,rng);
  // The first optional Lumenstone appears only after the key is collected.
  if (itemGrid) {
    // Custom or restored boards may already contain natural three-in-a-row matches.
    resolveAllMatches(state, rng, {source:"initial"});
    updateMonsterAwareness(state);
    return state;
  }

  for (let i = 0; i < 250; i++) {
    state.itemGrid = generateItemGrid({ layout, rng });
    if (hasLegalMatchMove(state)) { updateMonsterAwareness(state); return state; }
  }
  throw new Error("Unable to generate a starting board with a legal move");
}

function advanceStage(state, rng = defaultRng) {
  if (state.stage >= CONFIG.STAGE_COUNT) return;
  const next = newGame({rng, stage: state.stage + 1});
  const persistent = {
    resources: {...state.resources}, hp: state.hp, stats: state.stats,
    summonProgress: state.summonProgress,
    stagesCompleted: state.stagesCompleted + 1,
    keysCollected: state.keysCollected + 1,
    roomsExplored: state.roomsExplored + Math.max(0,state.visitedRooms.size-1),
  };
  Object.assign(state, next, persistent);
  state.lastEvent = `STAGE ${state.stage} — ${state.stage === CONFIG.STAGE_COUNT ? "RESCUE SANTA" : "FIND THE KEY"}`;
  updateScore(state);
}

function tryMatchMove(state, fromRow, fromCol, direction, options = {}) {
  const before={stage:state.stage,hp:state.hp,resources:{...state.resources},
    waves:state.stats.matchWaves.length};
  const success=performMatchMove(state,fromRow,fromCol,direction,options);
  if (success) state.stats.turnLog.push({turn:state.stats.turns,
    stage:before.stage,nextStage:state.stage,direction,swapFrom:[fromRow,fromCol],
    healthBefore:before.hp,healthAfter:state.hp,
    resourcesBefore:before.resources,resourcesAfter:{...state.resources},
    waves:state.stats.matchWaves.length-before.waves,
    enemies:state.monsters.length,score:state.score});
  return success;
}

function performMatchMove(state, fromRow, fromCol, direction, { rng = defaultRng } = {}) {
  state.lastMoveStarved = false;
  state.lastMoveBlocked = false;
  state.lastEvent = "";
  state.lastProximityDamage = 0;
  state.lastAttackDamage = 0;
  state.lastAttackDealt = 0;
  state.lastAttackBonusUsed = 0;
  state.lastCascadeBonus = 0;
  state.lastFallCells = new Set();
  state.animationEvents = [];
  state.animationHeroFrom = [state.playerRow, state.playerCol];

  if (state.gameOver || state.gameWon) return false;
  if (!(direction in DIRECTIONS)) return false;
  if (!canPlayerMove(state, direction)) {
    state.lastMoveBlocked = true;
    return false;
  }
  if (!swapIsBoardLegal(state, fromRow, fromCol, direction)) return false;

  const target = swapTarget(fromRow, fromCol, direction);
  const a = [fromRow, fromCol];
  const activated = activatedRunsAfterSwap(state.itemGrid, a, target, occupiedCells(state));
  if (!activated.length) return false;

  swapCells(state.itemGrid, a, target);
  const swapCascades = resolveAllMatches(state, rng, {source:"swap"});
  // Damage bonus is generated by THIS swap's consecutive cascade waves only.
  // It is spent on an attack during this turn, or lost on a normal move.
  const turnCascadeBonus = Math.max(0, swapCascades.waves - 1);
  state.lastCascadeBonus = turnCascadeBonus;

  const [dr, dc] = DIRECTIONS[direction];
  const destRow = state.playerRow + dr;
  const destCol = state.playerCol + dc;
  const defender = monsterAt(state, destRow, destCol);
  const damagedThisTurn = new Set();
  let moved = false;

  if (defender) {
    // An attack is animated AFTER the triggering matches and waterfalls.
    // Only a kill advances the hero into the target after the cascades.
    const beforeAttack = snapshotBoard(state);
    state.stats.turns++;
    const bonus = turnCascadeBonus; // Uncapped, never carries to a later turn.
    const attackPower = CONFIG.BASE_ATTACK_DAMAGE + bonus;
    const hpBefore = defender.hp;
    const effectiveDamage = Math.min(hpBefore, attackPower);
    const effectiveCascadeDamage = Math.max(0,
      effectiveDamage - Math.min(hpBefore, CONFIG.BASE_ATTACK_DAMAGE));
    const retaliation = monsterCanAttack(state,defender,state.playerRow,state.playerCol)
      ? monsterType(defender).damage : 0;
    defender.hp -= attackPower;
    alertMonster(state,defender);
    state.lastAttackDealt = effectiveDamage;
    state.lastAttackBonusUsed = bonus;
    state.stats.damageDealt += effectiveDamage;
    state.stats.cascadeDamageDealt += effectiveCascadeDamage;
    if (bonus > 0) state.stats.cascadePoweredAttacks++;
    state.hp = Math.max(0, state.hp - retaliation);
    state.lastAttackDamage = retaliation;
    if (retaliation) damagedThisTurn.add(defender); // No second attack or move this turn.
    if (defender.hp <= 0) {
      state.stats.monstersKilled++;
      state.monsters = state.monsters.filter((m) => m !== defender);
      state.playerRow = destRow;
      state.playerCol = destCol;
      moved = true;
      state.lastEvent = `MONSTER DEFEATED! ${effectiveDamage} DAMAGE${bonus ? ` (+${bonus} CASCADE)` : ""}`;
    } else {
      state.lastEvent = `HIT ${effectiveDamage}${bonus ? ` (+${bonus} CASCADE)` : ""} · ENEMY ${defender.hp} HP`;
    }
    state.animationEvents.push({
      type: "attack", before: beforeAttack, after: snapshotBoard(state),
      target: [destRow, destCol], bonus, damage: effectiveDamage,
      killed: defender.hp <= 0,
    });
  } else {
    movePlayerOneStep(state, direction);
    moved = true;
  }

  if (moved) {
    if (keyIsAt(state, state.playerRow, state.playerCol)) {
      state.hasKey = true;
      if (state.stage === CONFIG.STAGE_COUNT) {
        state.lastEvent = "SANTA FOUND! REACH THE EXIT!";
      } else placeLumenstone(state,rng);
      if (state.stage < CONFIG.STAGE_COUNT) state.lastEvent = "KEY FOUND! LUMENSTONE APPEARED!";
    }
    if (lumenIsAt(state,state.playerRow,state.playerCol)) {
      state.stats.lumenCollected++;
      state.stageLumenCollected = true;
      state.lumenPos = null;
      state.lastEvent = `LUMENSTONE +${CONFIG.LUMEN_SCORE} BONUS!`;
    }
    // The tile just vacated by the hero is matchable again.
    resolveAllMatches(state, rng, {source:"hero-reveal"});
  }
  processTriggers(state, rng);
  consumeFoodAfterMove(state);
  updateScore(state);
  if (state.gameOver) { state.gameWon = false; return true; }
  if (state.hp <= 0) {
    state.gameOver = true;
    state.gameOverReason = "death";
    state.gameWon = false;
    return true;
  }

  if (state.playerRow === state.dungeon.exitPos[0] && state.playerCol === state.dungeon.exitPos[1] && state.hasKey) {
    if (state.stage === CONFIG.STAGE_COUNT) {
      state.gameWon=true;
      state.gameOverReason="rescue";
      state.lastEvent="SANTA RESCUED!";
      updateScore(state);
    } else advanceStage(state, rng);
    return true;
  }

  updateMonsterAwareness(state);
  resolveProximityDamage(state, damagedThisTurn);
  if (!state.gameOver) {
    const monsterBefore = snapshotBoard(state);
    const oldPositions = new Map(state.monsters.map(m => [m,[m.row,m.col]]));
    moveMonsters(state, rng, damagedThisTurn);
    const movements = [];
    for (const monster of state.monsters) {
      const from = oldPositions.get(monster);
      if (from && (from[0] !== monster.row || from[1] !== monster.col)) {
        movements.push({ from, to: [monster.row,monster.col] });
      }
    }
    if (movements.length) {
      state.animationEvents.push({
        type: "monster-movement", before: monsterBefore,
        after: snapshotBoard(state), movements,
      });
    }
    // Monster movement is its action this turn. It cannot also attack:
    // adjacency damage is checked after the PLAYER's next action.
    // A monster can move away and reveal an ordinary three-in-a-row.
    // Resolve it automatically; no player swap is needed.
    if (!state.gameOver) resolveAllMatches(state, rng, {source:"monster-reveal"});
  }
  if (!state.gameOver) endIfNoMoves(state);
  updateScore(state);
  return true;
}

function swipeDirection(dx, dy, minimum = CONFIG.MIN_SWIPE) {
  if (Math.hypot(dx, dy) < minimum) return null;
  const angle = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360;
  if (angle < 22.5 || angle >= 337.5) return "RIGHT";
  if (angle < 67.5) return "DOWN_RIGHT";
  if (angle < 112.5) return "DOWN";
  if (angle < 157.5) return "DOWN_LEFT";
  if (angle < 202.5) return "LEFT";
  if (angle < 247.5) return "UP_LEFT";
  if (angle < 292.5) return "UP";
  return "UP_RIGHT";
}




const boardEl = document.querySelector("#board");
const statusEl = document.querySelector("#status");
const hpEl = document.querySelector("#hp");
const resourcesEl = document.querySelector("#resources");
const resultsEl = document.querySelector("#results");
const newGameBtn = document.querySelector("#new-game");
const flashEl = document.querySelector("#flash");
const matchFxEl = document.querySelector("#match-fx");

let game = null;
let pointerStart = null;
let animating = false;
let animationToken = 0;

function resetGame() {
  // Cancels a cascade replay if New game is pressed during an animation.
  animationToken++;
  animating = false;
  matchFxEl.replaceChildren();
  game = newGame();
  pointerStart = null;
  render();
}

function statusText() {
  if (game.gameWon) return "SANTA RESCUED!";
  if (game.gameOverReason === "no_moves") return "NO MOVES!";
  if (game.gameOverReason === "death") return "YOU DIED!";
  if (game.gameOverReason === "starvation") return "OUT OF MOVES!";
  const damage = game.lastProximityDamage + game.lastAttackDamage;
  if (damage > 0) {
    const source = game.lastProximityDamage > 0 ? "adjacent monster" : "attack";
    return `${game.lastEvent ? game.lastEvent + " · " : ""}♥ −${damage} (${source})`;
  }
  if (game.lastEvent) return game.lastEvent;
  if (isThreatened(game, game.playerRow, game.playerCol))
    return `⚠ Adjacent enemies: −${adjacentMonsterCount(game, game.playerRow, game.playerCol)} ♥ on next move`;
  if (game.stage === CONFIG.STAGE_COUNT) return game.hasKey
    ? "Santa is with you — reach exit >!" : "Find S, then bring Santa to exit >!";
  return game.hasKey ? "Key found — reach exit > · ◇ optional" : "Find K to reveal the first ◇ Lumenstone";
}

function resultsTitle() {
  if (game.gameWon) return "SANTA RESCUED";
  if (game.gameOverReason === "death") return "YOU DIED";
  if (game.gameOverReason === "starvation") return "OUT OF MOVES";
  if (game.gameOverReason === "no_moves") return "NO MOVES";
  return "GAME OVER";
}

function renderResults() {
  if (!game.gameOver && !game.gameWon) {
    resultsEl.classList.add("hidden");
    resultsEl.innerHTML = "";
    return;
  }
  const matchStats=matchSummary(game);
  const rows = CONFIG.ITEM_TYPES.map((kind) => {
    const label = CONFIG.ITEM_LABEL[kind];
    const color = CONFIG.ITEM_COLOR[kind];
    const amount = game.stats.resourcesCollected[kind];
    const displayName = { food: "Moves", health: "Health", monster: "Summons", gold: "Gold", bombs: "Reset" }[kind];
    return `<div><span style="color:${color};font-weight:700">${label}</span> ${displayName}: ${amount}</div>`;
  }).join("");
  resultsEl.innerHTML = `
    <div class="results-panel">
      <h2>${resultsTitle()}</h2>
      <div class="score">SCORE: ${game.score}</div>
      <div class="results-list">
        <div>New rooms: +${scoreBreakdown(game).rooms}</div>
        <div>Key: +${scoreBreakdown(game).key}</div>
        <div>Lumenstones (${game.stats.lumenCollected}): +${scoreBreakdown(game).lumen}</div>
        <div>Stages / rescue: +${scoreBreakdown(game).escape}</div>
        <div>Health bonus: +${scoreBreakdown(game).survival}</div>
        <div>Turns (${game.stats.turns}): −${scoreBreakdown(game).turns}</div>
        <div>Matches: ${matchStats.total}</div>
        <div>Horizontal / vertical: ${matchStats.byOrientation.horizontal} / ${matchStats.byOrientation.vertical}</div>
        <div>Match waves: ${matchStats.waves} (${matchStats.cascadeWaves} cascade)</div>
        <div>Longest cascade: ${matchStats.longestCascade} waves</div>
        <div>Matched tiles cleared: ${matchStats.clearedTiles}</div>
        <div>Matches by stage: ${[1,2,3].map(n=>matchStats.byStage[n]||0).join(" / ")}</div>
        <div>Peak health: ${game.stats.peakHealth}</div>
        <div>Board resets: ${game.stats.boardResets}</div>
        <div>Monsters spawned: ${game.stats.monstersSpawned}</div>
        <div>Monsters killed: ${game.stats.monstersKilled} (+${scoreBreakdown(game).kills})</div>
        <div>Total damage dealt: ${game.stats.damageDealt}</div>
        <div>Cascade bonus damage: ${game.stats.cascadeDamageDealt}</div>
        <div>Cascade-powered attacks: ${game.stats.cascadePoweredAttacks}</div>${rows}
      </div>
      <button id="copy-results" type="button">Copy run data</button>
      <textarea id="run-data" readonly hidden aria-label="Run data to copy" style="width:100%;height:140px"></textarea>
      <button id="overlay-new-game" type="button">New game</button>
    </div>`;
  resultsEl.classList.remove("hidden");
  resultsEl.querySelector("#overlay-new-game").addEventListener("click", resetGame);
  resultsEl.querySelector("#copy-results").addEventListener("click", async (event)=>{
    const button=event.currentTarget;
    const data=JSON.stringify(runData(game),null,2);
    try {
      await navigator.clipboard.writeText(data);
      button.textContent="Copied!";
    } catch {
      const field=resultsEl.querySelector("#run-data");
      field.hidden=false;field.value=data;field.focus();field.select();
      button.textContent="Select and copy the data below";
    }
  });
}

function renderHud() {
  statusEl.textContent = statusText();
  statusEl.classList.toggle("damage", game.lastProximityDamage + game.lastAttackDamage > 0);
  statusEl.classList.toggle("danger", !game.gameOver && !game.gameWon &&
    isThreatened(game, game.playerRow, game.playerCol));
  // First line: the numbers a player checks most often during a turn.
  hpEl.innerHTML = `<span class="hp-value">♥ ${game.hp}/${CONFIG.MAX_HP}</span><span class="food-value">${CONFIG.ITEM_LABEL.food} ${game.resources.food} <span class="name">Moves</span></span><span class="turn-value">TURN ${game.stats.turns}</span><span class="score-value">SCORE ${game.score}</span>`;
  // Second line: objectives and other resources. Use the same icons as the board.
  resourcesEl.innerHTML = `<span>STAGE ${game.stage}/3</span><span>ENEMIES ${game.monsters.length}</span><span class="key-value">${game.stage === CONFIG.STAGE_COUNT ? "SANTA" : "KEY"} ${game.hasKey ? "✓" : "—"}</span><span class="resource-count"><span style="color:${CONFIG.ITEM_COLOR.gold};font-weight:800">${CONFIG.ITEM_LABEL.gold} ${game.resources.gold}</span> <span class="name">Gold</span></span><span class="resource-count"><span style="color:${CONFIG.ITEM_COLOR.bombs};font-weight:800">${CONFIG.ITEM_LABEL.bombs} ${game.resources.bombs}/${CONFIG.BOMB_RESET_THRESHOLD}</span> <span class="name" style="color:${CONFIG.ITEM_COLOR.bombs};font-weight:700">Reset</span></span><span class="resource-count"><span style="color:#b5f9f7;font-weight:800">◇ ${game.stats.lumenCollected}</span> <span class="name">Lumen</span></span>`;
}

function renderBoard(view = game, { matched = null, dropDistances = null,
  heroFrom = null, monsterMovements = null,
  attackTarget = null, attackWindup = false } = {}) {
  const heroRow = view.playerRow;
  const heroCol = view.playerCol;
  const matchKeys = matched ? new Set(matched.flatMap(m => m.cells.map(coordKey))) : null;
  const tileSize = (boardEl.clientWidth - (CONFIG.BOARD_COLS-1)*3) / CONFIG.BOARD_COLS;
  const frag = document.createDocumentFragment();
  for (let row = 0; row < CONFIG.BOARD_ROWS; row++) {
    for (let col = 0; col < CONFIG.BOARD_COLS; col++) {
      const tile = document.createElement("div");
      tile.className = `tile ${view.dungeon.ground[row][col]}`;
      tile.dataset.row = row;
      tile.dataset.col = col;

      const isHero = row === heroRow && col === heroCol;
      const cellKey = `${row},${col}`;
      if (matchKeys?.has(cellKey)) tile.classList.add("match-tile");
      if (isHero) {
        tile.classList.add("hero");
        if (attackWindup && attackTarget) {
          tile.classList.add("attack-windup");
          tile.style.setProperty("--attack-x", `${(attackTarget[1]-col)*tileSize*.30}px`);
          tile.style.setProperty("--attack-y", `${(attackTarget[0]-row)*tileSize*.30}px`);
        }
        if (heroFrom && (heroFrom[0] !== row || heroFrom[1] !== col)) {
          tile.classList.add("hero-moving");
          tile.style.setProperty("--hero-from-x", `${(heroFrom[1]-col)*(tileSize+3)}px`);
          tile.style.setProperty("--hero-from-y", `${(heroFrom[0]-row)*(tileSize+3)}px`);
        }
      }
      // Only walkable tiles receive heat. Never obscure monsters or walls.
      // Count actual adjacent enemies so overlapping danger intensifies.
      const monsterCount = isWalkable(view.dungeon, row, col)
        ? adjacentMonsterCount(view, row, col) : 0;
      if (monsterCount > 0 && !monsterAt(view, row, col)) {
        tile.classList.add("heat");
        tile.style.setProperty("--heat-alpha", dangerOpacity(monsterCount).toFixed(4));
      }
      if (isHero && view.lastProximityDamage + view.lastAttackDamage > 0)
        tile.classList.add("recent-hit");

      const item = view.itemGrid[row][col];
      if (item !== null) {
        const resource = document.createElement("span");
        resource.className = "resource";
        if (item === "monster" || item === "bombs") resource.classList.add("symbol-star");
        if (dropDistances && dropDistances[cellKey] > 0) {
          tile.classList.add("fall-tile");
          resource.classList.add("falling");
          resource.style.setProperty("--drop-px", `${dropDistances[cellKey]*(tileSize+3)}px`);
        }
        resource.textContent = CONFIG.ITEM_LABEL[item];
        resource.style.color = CONFIG.ITEM_COLOR[item];
        tile.appendChild(resource);
      }

      if (row === view.dungeon.entrancePos[0] && col === view.dungeon.entrancePos[1]) {
        tile.classList.add("entrance-tile");
        const marker = document.createElement("span");
        marker.className = "marker entrance";
        marker.textContent = CONFIG.ENTRANCE_LABEL;
        tile.appendChild(marker);
      }
      if (row === view.dungeon.exitPos[0] && col === view.dungeon.exitPos[1]) {
        tile.classList.add("exit-tile");
        const marker = document.createElement("span");
        marker.className = "marker exit";
        marker.textContent = CONFIG.EXIT_LABEL;
        tile.appendChild(marker);
      }
      if (keyIsAt(view,row,col)) {
        tile.classList.add("key-tile");
        const key = document.createElement("span");
        key.className = "key-mark";
        key.textContent = view.stage === CONFIG.STAGE_COUNT ? "S" : "K";
        tile.appendChild(key);
      }
      if (lumenIsAt(view,row,col)) {
        tile.classList.add("lumen-tile");
        const stone=document.createElement("span");
        stone.className="lumen-mark";
        stone.textContent="◇";
        tile.appendChild(stone);
      }
      const monster = monsterAt(view,row,col);
      if (monster) {
        tile.classList.add("monster-tile");
        if (attackWindup && attackTarget &&
            row === attackTarget[0] && col === attackTarget[1])
          tile.classList.add("attack-target");
        if (monsterMovements) {
          const movement = monsterMovements.find(m => m.to[0] === row && m.to[1] === col);
          if (movement) {
            tile.classList.add("monster-moving");
            tile.style.setProperty("--monster-from-x", `${(movement.from[1]-col)*(tileSize+3)}px`);
            tile.style.setProperty("--monster-from-y", `${(movement.from[0]-row)*(tileSize+3)}px`);
          }
        }
        if (monster.aggro) tile.classList.add("aggro");
        const mark = document.createElement("span");
        mark.className = "monster-mark";
        mark.textContent = String(monster.hp);
        const definition=monsterType(monster);
        const pattern=document.createElement("span");
        pattern.className="monster-pattern";
        pattern.textContent=definition.symbol;
        mark.appendChild(pattern);
        tile.title=`${definition.name}: ${monster.hp} HP; ${definition.attack === "eight" ? "eight-way in rooms" : "cardinal"} attacks; ${monster.aggro ? "pursuing" : "wandering"}`;
        tile.appendChild(mark);
      }
      if (isHero) {
        const hero = document.createElement("span");
        hero.className = "hero-mark";
        hero.textContent = "@";
        tile.appendChild(hero);
      }
      frag.appendChild(tile);
    }
  }
  boardEl.replaceChildren(frag);
}

function render() {
  renderBoard();
  renderHud();
  renderResults();
}

function showMatchRewards(matches) {
  matchFxEl.replaceChildren();
  const cells = boardEl.children;
  for (const match of matches) {
    const positions = match.cells.map(([r,c]) => cells[r*CONFIG.BOARD_COLS+c]);
    if (!positions.length) continue;
    const centerX = positions.reduce((sum,tile) => sum+tile.offsetLeft+tile.offsetWidth/2,0)/positions.length;
    const centerY = positions.reduce((sum,tile) => sum+tile.offsetTop+tile.offsetHeight/2,0)/positions.length;
    const pop = document.createElement("span");
    pop.className = "reward-pop";
    pop.style.left = `${centerX}px`;
    pop.style.top = `${centerY}px`;
    pop.style.color = CONFIG.ITEM_COLOR[match.kind];
    pop.textContent = `+${match.gained} ${CONFIG.ITEM_LABEL[match.kind]}`;
    matchFxEl.appendChild(pop);
  }
}

const wait = ms => new Promise(resolve => setTimeout(resolve,ms));

function showHeroBonusPopup(bonus) {
  if (bonus <= 0) return;
  const tile = boardEl.children[game.playerRow * CONFIG.BOARD_COLS + game.playerCol];
  // During an attack replay the hero is still on the original tile.
  const actualTile = boardEl.querySelector(".tile.hero") || tile;
  if (!actualTile) return;
  const pop = document.createElement("span");
  pop.className = "reward-pop hero-bonus-pop";
  pop.style.left = `${actualTile.offsetLeft + actualTile.offsetWidth / 2}px`;
  pop.style.top = `${actualTile.offsetTop + actualTile.offsetHeight / 2}px`;
  pop.textContent = `+${bonus} ⚔`;
  matchFxEl.appendChild(pop);
}

async function playCascadeAnimation(events) {
  if (!events.length) { render(); return; }
  const token = ++animationToken;
  animating = true;
  const isActive = () => token === animationToken;
  const attackIndex = events.findIndex(event => event.type === "attack");
  const attackEvent = attackIndex >= 0 ? events[attackIndex] : null;
  renderHud();
  resultsEl.classList.add("hidden");

  async function playMatchFrame(frame, viewFor = v => v, options = {}) {
    if (!isActive()) return;
    renderBoard(viewFor(frame.before), { matched: frame.matches, ...options });
    showMatchRewards(frame.matches);
    await wait(390);
    if (!isActive()) return;
    matchFxEl.replaceChildren();
    renderBoard(viewFor(frame.after), { dropDistances: frame.dropDistances });
    await wait(460);
  }

  if (attackEvent) {
    // Crucial: the hero stays at the origin throughout the attack's
    // waterfall. Resolve the attack after its triggering cascades, then
    // animate movement into the target only when the enemy was defeated.
    for (const event of events.slice(0, attackIndex)) {
      if (!isActive()) return;
      if (!event.type) await playMatchFrame(event);
    }
    if (!isActive()) return;
    renderBoard(attackEvent.before);
    if (attackEvent.bonus > 0) {
      showHeroBonusPopup(attackEvent.bonus);
      await wait(390); // Same lifespan as a match reward popup.
      if (!isActive()) return;
      matchFxEl.replaceChildren();
    }
    renderBoard(attackEvent.before, {
      attackWindup: true, attackTarget: attackEvent.target,
    });
    await wait(230);
    if (!isActive()) return;
    renderBoard(attackEvent.after, {
      heroFrom: attackEvent.killed
        ? [attackEvent.before.playerRow,attackEvent.before.playerCol] : null,
    });
    await wait(240);
    // On an attack turn, monster movement follows the resolved attack
    // rather than appearing to strike before the match animation.
    for (const event of events.slice(attackIndex + 1)) {
      if (!isActive()) return;
      if (event.type === "monster-movement") {
        renderBoard(event.after, { monsterMovements: event.movements });
        await wait(280);
      } else if (!event.type) {
        await playMatchFrame(event);
      }
    }
  } else {
    // Preserve Reset 2.3's simultaneous hero/monster movement for ordinary
    // moves. This is only visual; game logic remains deterministic.
    const monsterEvent = events.find(event => event.type === "monster-movement");
    const movements = monsterEvent?.movements || [];
    const cascadeFrames = events.filter(event => !event.type).slice(0, 12);
    const destination = [game.playerRow, game.playerCol];
    const movedMonsterPositions = (monsters) => monsters.map(monster => {
      const movement = movements.find(m =>
        m.from[0] === monster.row && m.from[1] === monster.col);
      return movement ? { ...monster, row: movement.to[0], col: movement.to[1] } : monster;
    });
    const visualState = view => ({
      ...view, playerRow: destination[0], playerCol: destination[1],
      monsters: movedMonsterPositions(view.monsters),
      hasKey: game.hasKey, lumenPos: game.lumenPos,
    });
    if (!cascadeFrames.length) {
      const view = monsterEvent?.before || snapshotBoard(game);
      renderBoard(visualState(view), {
        heroFrom: game.animationHeroFrom,
        monsterMovements: movements,
      });
      await wait(280);
    }
    let firstFrame = true;
    for (const frame of cascadeFrames) {
      if (!isActive()) return;
      await playMatchFrame(frame, visualState, {
        heroFrom: firstFrame ? game.animationHeroFrom : null,
        monsterMovements: firstFrame ? movements : null,
      });
      firstFrame = false;
    }
    if (!isActive()) return;
    // Show cascade power once, over the hero, then discard it.
    // It is NOT saved for an attack on a later turn.
    if (game.lastCascadeBonus > 0) {
      showHeroBonusPopup(game.lastCascadeBonus);
      await wait(390);
      if (!isActive()) return;
      matchFxEl.replaceChildren();
    }
  }
  if (!isActive()) return;
  matchFxEl.replaceChildren();
  animating = false;
  render();
}

function flash(kind) {
  flashEl.className = "";
  void flashEl.offsetWidth;
  flashEl.className = kind;
}

function tileFromEventTarget(target) {
  const tile = target.closest?.(".tile");
  if (!tile || !boardEl.contains(tile)) return null;
  return { row: Number(tile.dataset.row), col: Number(tile.dataset.col) };
}

boardEl.addEventListener("pointerdown", (event) => {
  if (animating || game.gameOver || game.gameWon) return;
  const cell = tileFromEventTarget(event.target);
  if (!cell) return;
  pointerStart = {
    ...cell,
    x: event.clientX,
    y: event.clientY,
    pointerId: event.pointerId,
  };
  boardEl.setPointerCapture?.(event.pointerId);
  event.preventDefault();
});

boardEl.addEventListener("pointerup", (event) => {
  if (!pointerStart || event.pointerId !== pointerStart.pointerId) return;
  event.preventDefault();
  const dx = event.clientX - pointerStart.x;
  const dy = event.clientY - pointerStart.y;
  const direction = swipeDirection(dx, dy);
  const { row, col } = pointerStart;
  pointerStart = null;
  if (!direction) return;

  const moved = tryMatchMove(game, row, col, direction);
  if (moved && game.lastMoveStarved) flash("starving");
  else if (!moved && game.lastMoveBlocked) flash("blocked");
  else if (!moved) flash("invalid");
  if (moved) void playCascadeAnimation(game.animationEvents);
  else render();
});

boardEl.addEventListener("pointercancel", () => { pointerStart = null; });
boardEl.addEventListener("contextmenu", (event) => event.preventDefault());
newGameBtn.addEventListener("click", resetGame);

resetGame();

  </script>
</body>
</html>
